aid: fundamental-technologies
name: Fundamental Technologies
description: >-
  Fundamental Technologies Inc. (Fundamental) is an AI company building foundation
  models for predictive decision-making across enterprises and governments. Its
  flagship product, NEXUS, is a large tabular model pre-trained on billions of
  real-world enterprise tables and designed to capture the complex, non-linear
  feature interactions in structured data that large language models handle poorly.
  NEXUS is positioned to be deployed "with just one line of code" with a deep AWS
  integration and confidential-computing privacy controls. Founded by DeepMind
  alumni and led by serial entrepreneurs, the company raised a $255M Series A in
  February 2026 and is surfaced in the API Evangelist network as a Battery Ventures
  portfolio company. As of this profile it publishes a marketing and research
  presence at fundamental.tech but no public developer API, documentation, or SDKs.
